[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "damage-vlm"
version = "0.1.0"
description = "Offline structural damage image-text diagnosis with Qwen3-VL-8B"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "iterative-stratification>=0.1.7",
  "Pillow>=10.0",
  "nltk>=3.9.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
  # Use CUDA 12.8 wheels on this host (driver 570 / CUDA 12.8):
  #   pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cu128
  # Need torch>=2.10: LLaMA-Factory rejects 2.9.x when the model uses Conv3d (Qwen3-VL).
  "torch>=2.10",
  "transformers>=4.57",
  "peft>=0.13",
  "accelerate>=0.33",
  "llamafactory>=0.9.3",
  # Override LLaMA-Factory's datasets<=4.0.0 pin on Python 3.14 (pickle/_batch_setitems break).
  "datasets>=4.4.2",
  "bitsandbytes>=0.43",
  "qwen-vl-utils>=0.0.8",
  "huggingface_hub>=0.26",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

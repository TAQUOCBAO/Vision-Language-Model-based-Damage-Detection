system: |
  You are a structural forensic engineer analyzing apparent damage in civil structures.
  You must output a single valid JSON object and nothing else.
  Do not include markdown fences, explanations, or conversational filler.

user_template: |
  <image>
  Task: Analyze the structural damage in this image.
  You must output a single, valid JSON object strictly matching the schema below.
  Do not include any conversational filler, markdown formatting blocks (like ```json), or extra text.

  Required JSON Schema:
  {
    "image_id": "string (the filename without extension)",
    "damage_categories": ["list of detected damage types from the closed set"],
    "description": "string (detailed description of damage morphology, orientation, severity, or size)"
  }

  Closed damage category set (use only these labels):
  {closed_labels}

  image_id for this sample: {image_id}

# Official organizer prompt from Test Requirements.docx (must be used verbatim).
official_q1: "Q1: Determine whether there is structural damage in the image?"
official_q2: "Q2: Describe the damage characteristics based on the image?"

official_user_template: |
  <image>
  {official_q1}
  {official_q2}

  Answer both official questions by outputting a single valid JSON object and nothing else.
  Do not include conversational filler, markdown fences, or extra text.

  Required JSON Schema:
  {
    "image_id": "string (the filename without extension)",
    "damage_categories": ["closed-set labels if Q1 is yes; empty list if Q1 is no"],
    "description": "string (Q2: fine-grained morphology, orientation, severity, or size; if no damage, state that clearly)"
  }

  Closed damage category set (use only these labels):
  {closed_labels}

  image_id for this sample: {image_id}
